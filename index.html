<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3-maktab — Bilim sari birinchi qadam</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0d9488"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="3-maktab">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#e8f4f2;--ink:#0c1e26;--mut:#587078;--br:#0d9488;--br2:#14b8a6;--br3:#22d3ee;--ac:#f59e0b;--card:rgba(255,255,255,.82);--cs:#fff;--fld:rgba(255,255,255,.95);--ln:rgba(12,70,80,.13);--ok:#10b981;--bad:#ef4444;--glass:rgba(255,255,255,.78);--sh:0 1px 2px rgba(10,50,60,.05),0 10px 28px -12px rgba(10,70,80,.2);--shh:0 2px 6px rgba(10,50,60,.06),0 26px 50px -18px rgba(13,148,136,.45);--r:22px;--side:278px;--g1:#0d9488;--g2:#6366f1;--g3:#d97706;--blob:.5;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#05121a;--ink:#e6f6f3;--mut:#8fb2b6;--br:#2dd4bf;--card:rgba(15,36,44,.8);--cs:#0e232b;--fld:rgba(255,255,255,.06);--ln:rgba(150,235,225,.14);--glass:rgba(8,26,33,.8);--sh:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.6);--shh:0 2px 6px rgba(0,0,0,.4),0 28px 54px -18px rgba(20,184,166,.38);--g1:#2dd4bf;--g2:#a5b4fc;--g3:#fbbf24;--blob:.36;color-scheme:dark}}
:root[data-theme=dark]{--bg:#05121a;--ink:#e6f6f3;--mut:#8fb2b6;--br:#2dd4bf;--card:rgba(15,36,44,.8);--cs:#0e232b;--fld:rgba(255,255,255,.06);--ln:rgba(150,235,225,.14);--glass:rgba(8,26,33,.8);--sh:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.6);--shh:0 2px 6px rgba(0,0,0,.4),0 28px 54px -18px rgba(20,184,166,.38);--g1:#2dd4bf;--g2:#a5b4fc;--g3:#fbbf24;--blob:.36;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-behavior:smooth}
body{font-family:"Inter","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.nos{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
option{background:var(--cs);color:var(--ink)}
.g{background:linear-gradient(135deg,#2dd4bf,#0d9488 55%,#0e7490)}
::selection{background:color-mix(in srgb,var(--br) 35%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--br) 35%,transparent);border-radius:9px;border:2px solid transparent;background-clip:content-box}

/* ---------- fon ---------- */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;opacity:var(--blob);will-change:transform}
.bgfx i:nth-child(1){left:-20vmax;top:-26vmax;background:radial-gradient(circle,#14b8a6,transparent 64%);animation:drift1 24s ease-in-out infinite alternate}
.bgfx i:nth-child(2){right:-24vmax;top:6vh;background:radial-gradient(circle,#22d3ee,transparent 64%);animation:drift2 29s ease-in-out infinite alternate}
.bgfx i:nth-child(3){left:18vw;bottom:-34vmax;background:radial-gradient(circle,#f59e0b,transparent 66%);opacity:calc(var(--blob)*.55);animation:drift3 33s ease-in-out infinite alternate}
.bgfx:after{content:"";position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--br) 28%,transparent) 1px,transparent 1.2px);background-size:28px 28px;-webkit-mask-image:linear-gradient(#000,transparent 75%);mask-image:linear-gradient(#000,transparent 75%);opacity:.55}

/* ---------- tuzilma ---------- */
.main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:104px}
.wrap{width:100%;max-width:1220px;margin:0 auto;padding:26px clamp(14px,3.2vw,40px) 18px;flex:1;transition:opacity .17s ease,transform .17s ease}
.wrap.out{opacity:0;transform:translateY(10px) scale(.995)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px clamp(14px,3.2vw,40px);padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--ln)}
.top .tt{font-size:1.1rem;font-weight:800;letter-spacing:-.01em}
.top .tt{margin-right:auto}.top .clk{font-size:.82rem;font-weight:700;color:var(--mut);padding:6px 12px;border-radius:99px;background:var(--fld);border:1px solid var(--ln);display:none}
.top .uav{cursor:pointer;border-radius:50%;transition:transform .3s cubic-bezier(.2,.8,.2,1)}.top .uav:hover{transform:scale(1.1) rotate(6deg)}
.ib{background:var(--fld);border:1px solid var(--ln);border-radius:12px;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;transition:transform .25s,background .25s}.ib:hover{transform:scale(1.08)}.ib:active{transform:scale(.92)}
.foot{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 16px 8px;color:var(--mut);font-size:.78rem;text-align:center}
.dim{position:fixed;inset:0;background:rgba(2,12,16,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .35s}.dim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border-right:1px solid var(--ln);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);transform:translateX(-104%);transition:transform .45s cubic-bezier(.2,.85,.2,1);box-shadow:0 0 60px rgba(0,0,0,.25)}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln)}.dh .logo{margin:0}.dh .ib{margin-left:auto}
.dsc{flex:1;overflow-y:auto;padding:12px}
.ucard{display:flex;gap:12px;align-items:center;margin-top:2px;background:linear-gradient(135deg,color-mix(in srgb,var(--br) 14%,transparent),transparent);border:1px solid var(--ln);border-radius:18px;padding:12px;margin-bottom:6px}
.ucard b{display:block;line-height:1.25}
.gt{font-size:.7rem;font-weight:800;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;margin:12px 10px 4px}
.mi{position:relative;display:flex;align-items:center;gap:13px;padding:9px 12px;border-radius:14px;cursor:pointer;font-weight:650;color:var(--ink);transition:background .25s,transform .25s,color .25s;margin-bottom:2px}
.mi svg{margin:0;color:var(--mut);transition:color .25s,transform .35s cubic-bezier(.2,.8,.2,1)}
.mi:hover{background:color-mix(in srgb,var(--br) 9%,transparent);transform:translateX(4px)}.mi:hover svg{transform:scale(1.18) rotate(-6deg);color:var(--br)}
.mi.on{background:linear-gradient(90deg,color-mix(in srgb,var(--br) 22%,transparent),color-mix(in srgb,var(--br) 4%,transparent));color:var(--br)}.mi.on svg{color:var(--br)}
.mi.on:before{content:"";position:absolute;left:-12px;top:20%;bottom:20%;width:4px;border-radius:0 6px 6px 0;background:linear-gradient(var(--br2),var(--br3))}
.df{padding:12px;border-top:1px solid var(--ln);display:grid;grid-template-columns:1fr 1fr;gap:8px}.df .btn{padding:10px 8px;font-size:.9rem}.df .cred{justify-self:center;grid-column:1/-1}
.tb{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 20px);max-width:620px;z-index:30;display:flex;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--ln);border-radius:26px;padding:6px 4px;box-shadow:0 18px 40px -12px rgba(0,0,0,.3)}
.tb a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 4px;font-size:.7rem;font-weight:700;color:var(--mut);cursor:pointer;transition:color .25s;min-width:0}
.tb a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tb a svg{margin:0;width:20px;height:20px;padding:7px;box-sizing:content-box;border-radius:15px;transition:transform .3s}
.tb a:active svg{transform:scale(.85)}
.tb a.on{color:var(--br)}.tb a.on svg{color:#fff;background:linear-gradient(135deg,var(--br2),#0f766e);box-shadow:0 10px 18px -6px rgba(13,148,136,.75);animation:tabpop .55s cubic-bezier(.2,.9,.3,1.3) both;transform:translateY(-4px)}
@media(min-width:900px){
 .drawer{transform:none;width:var(--side);box-shadow:none;transition:none}.dim,.tb,.burger,.dh .ib{display:none!important}
 .main{margin-left:var(--side);padding-bottom:0}.top .clk{display:block}

 .foot{flex-direction:row;justify-content:space-between;padding:14px clamp(14px,3.2vw,40px) 20px;max-width:1220px;margin:0 auto;width:100%}
}
@media(max-height:800px) and (min-width:900px){.mi{padding:6px 12px}.gt{margin:8px 10px 2px}.ucard{padding:8px 12px}}
@media(min-width:1500px){.wrap,.foot{max-width:1360px}}

/* ---------- matn ---------- */
h2{display:flex;align-items:center;gap:12px;font-size:clamp(1.5rem,2.6vw,2.05rem);font-weight:850;letter-spacing:-.025em;line-height:1.15;margin:8px 0 18px}
h2:before{content:"";flex:none;width:7px;height:1.05em;border-radius:8px;background:linear-gradient(var(--br2),var(--br3));box-shadow:0 0 16px color-mix(in srgb,var(--br2) 70%,transparent)}
h3{font-size:1.08rem;font-weight:750;letter-spacing:-.01em}
.mut{color:var(--mut);font-size:.9rem}
.sp{height:14px}
.logo{font-weight:850;font-size:1.1rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo i{font-style:normal;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;box-shadow:0 8px 18px -6px rgba(13,148,136,.7);transition:transform .5s cubic-bezier(.2,.9,.3,1.4)}.logo:hover i{transform:rotate(-14deg) scale(1.12)}.logo svg{margin:0}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;color:#fff;font-weight:800;flex:none;box-shadow:0 0 0 2px var(--cs),0 0 0 4px color-mix(in srgb,var(--br) 55%,transparent)}

/* ---------- tugmalar ---------- */
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 22px;font-weight:750;letter-spacing:.01em;cursor:pointer;color:#fff;background:linear-gradient(135deg,#2dd4bf,#0d9488 55%,#0f766e);box-shadow:0 10px 22px -10px rgba(13,148,136,.85),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,filter .3s,background .3s}
.btn:before{content:"";position:absolute;top:0;bottom:0;left:0;width:55%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-160%) skewX(-18deg);transition:transform .8s}
.btn:hover{transform:translateY(-3px);box-shadow:0 18px 30px -12px rgba(13,148,136,.9),inset 0 1px 0 rgba(255,255,255,.4);filter:saturate(1.15)}
.btn:hover:before{transform:translateX(320%) skewX(-18deg)}
.btn:active{transform:translateY(0) scale(.96);transition-duration:.1s}
.btn:focus-visible,.ib:focus-visible,.mi:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--br2) 55%,transparent);outline-offset:2px}
.btn svg{margin:0;flex:none}
.btn.ac{background:linear-gradient(135deg,#fcd34d,#f59e0b 60%,#ea8a06);color:#3a2300;box-shadow:0 10px 22px -10px rgba(245,158,11,.9),inset 0 1px 0 rgba(255,255,255,.5)}.btn.ac:hover{box-shadow:0 18px 30px -12px rgba(245,158,11,.95),inset 0 1px 0 rgba(255,255,255,.55)}
.btn.bad{background:linear-gradient(135deg,#fb7185,#ef4444 60%,#dc2626);box-shadow:0 10px 22px -10px rgba(239,68,68,.8),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.line{background:var(--fld);color:var(--ink);border:1.5px solid var(--ln);box-shadow:none}.btn.line:hover{border-color:var(--br);color:var(--br);box-shadow:0 12px 24px -14px rgba(13,148,136,.7)}
.btn.glass{background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.5);box-shadow:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}.btn.glass:hover{background:rgba(255,255,255,.28);box-shadow:0 14px 28px -14px rgba(0,0,0,.45)}
.btn.tg{background:linear-gradient(135deg,#38bdf8,#229ed9);width:100%}
.btn.sm{padding:8px 14px;font-size:.85rem;border-radius:11px;gap:6px}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .65s ease-out forwards;pointer-events:none;z-index:-1}
.btn.line .rip{background:color-mix(in srgb,var(--br) 30%,transparent)}

/* ---------- kartalar ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.card{position:relative;background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:22px;box-shadow:var(--sh);transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s,border-color .4s}
.card:not(:focus-within):hover{transform:translateY(-5px);box-shadow:var(--shh);border-color:color-mix(in srgb,var(--br) 45%,var(--ln))}
.card:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--br2) 16%,transparent),transparent 70%);opacity:0;transition:opacity .4s}.card:hover:after{opacity:1}
.card h3{margin-bottom:6px}
.empty{padding:34px 20px;text-align:center;color:var(--mut);border:1.5px dashed var(--ln);border-radius:var(--r);background:var(--fld)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-bottom:26px}
.stats div{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:20px 14px;text-align:center;box-shadow:var(--sh);transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.stats div:hover{transform:translateY(-5px) scale(1.02);box-shadow:var(--shh)}
.stats div:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--br2),var(--br3),var(--ac))}
.stats b{display:block;font-size:clamp(2rem,4.2vw,2.9rem);font-weight:900;line-height:1.1;letter-spacing:-.03em;background:linear-gradient(135deg,var(--br),var(--br3));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;font-size:.76rem;font-weight:750;background:color-mix(in srgb,var(--br) 12%,transparent);color:var(--br);border:1px solid color-mix(in srgb,var(--br) 28%,transparent)}
.gr{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;color:#fff;font-weight:800}
.g5{background:var(--ok)}.g4{background:#3b82f6}.g3{background:var(--ac)}.g2{background:var(--bad)}
.cm{border-top:1px solid var(--ln);padding:10px 0;font-size:.92rem}.cm a.x{color:var(--bad);cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:10px 8px;border-bottom:1px solid var(--ln);text-align:left}tr{transition:background .2s}.tbl tr:hover td{background:color-mix(in srgb,var(--br) 6%,transparent)}
.tbl{overflow-x:auto}

/* ---------- formalar ---------- */
input,select,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--ln);background:var(--fld);margin:5px 0;transition:border-color .25s,box-shadow .25s,background .25s}
textarea{resize:vertical;min-height:84px}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--br) 45%,var(--ln))}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--br2);box-shadow:0 0 0 4px color-mix(in srgb,var(--br2) 22%,transparent)}
input[type=file]{display:none}
label{font-size:.8rem;font-weight:750;color:var(--mut);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.err{color:var(--bad);font-size:.88rem;min-height:1.2em;margin:4px 0;font-weight:600}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:.8rem;margin:14px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--ln)}
.drop{display:flex;align-items:center;gap:14px;margin:8px 0 12px;padding:16px;border:2px dashed color-mix(in srgb,var(--br) 40%,var(--ln));border-radius:16px;cursor:pointer;color:var(--ink);background:color-mix(in srgb,var(--br) 5%,transparent);transition:all .3s}
.drop svg{width:34px;height:34px;padding:8px;border-radius:12px;background:linear-gradient(135deg,var(--br2),var(--br3));color:#fff;box-sizing:content-box;flex:none;transition:transform .4s}
.drop span{display:flex;flex-direction:column;font-size:.95rem}.drop small{color:var(--mut);font-weight:500;font-size:.8rem}
.drop:hover,.drop.ov{border-color:var(--br2);background:color-mix(in srgb,var(--br) 11%,transparent);transform:translateY(-2px)}.drop:hover svg{transform:rotate(-8deg) scale(1.1)}
.pv{position:relative;margin:8px 0 12px;border-radius:16px;overflow:hidden;border:1px solid var(--ln);animation:pop .4s both}
.pv img{display:block;width:100%;max-height:260px;object-fit:cover}.pv .btn{position:absolute;right:10px;top:10px}

/* ---------- kirish ---------- */
.auth{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);position:relative}
.aform{display:grid;place-items:center;padding:24px 16px;position:relative}
.aart{display:none;position:relative;overflow:hidden;color:#fff;padding:clamp(36px,5vw,64px);flex-direction:column;justify-content:space-between;background:linear-gradient(140deg,#0a4f49,#0d9488 52%,#0891b2);background-size:220% 220%;animation:bg 16s ease infinite;isolation:isolate}
.aart:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(520px 320px at 10% 0%,rgba(255,255,255,.25),transparent 60%),radial-gradient(520px 360px at 100% 100%,rgba(251,191,36,.25),transparent 60%)}
.aart .o{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);z-index:-1;animation:fl 9s ease-in-out infinite}
.aart .o1{width:340px;height:340px;right:-90px;top:12%}.aart .o2{width:180px;height:180px;left:8%;bottom:16%;animation-delay:-3s;background:rgba(255,255,255,.07)}.aart .o3{width:90px;height:90px;right:22%;bottom:8%;animation-delay:-6s;background:rgba(251,191,36,.3);border:0}
.aart .logo{color:#fff;font-size:1.3rem}.aart .logo i{background:rgba(255,255,255,.2)}
.aart h2{display:block;font-size:clamp(2.4rem,4.4vw,3.8rem);line-height:1.04;margin:14px 0}.aart h2:before{display:none}
.aart h2 em{font-style:normal;background:linear-gradient(90deg,#fde68a,#fff,#a7f3d0,#fde68a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
.aart p{max-width:460px;opacity:.9;font-size:1.05rem}
.af{list-style:none;margin:26px 0 0;display:grid;gap:12px}.af li{display:flex;align-items:center;gap:12px;font-weight:650;animation:inL .7s both}.af li:nth-child(2){animation-delay:.12s}.af li:nth-child(3){animation-delay:.24s}
.af svg{width:20px;height:20px;padding:9px;border-radius:14px;box-sizing:content-box;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3)}
.kick{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;font-size:.8rem;font-weight:750;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);letter-spacing:.02em}.kick i{width:8px;height:8px;border-radius:50%;background:#fde68a;animation:ping2 1.8s infinite}
.box{position:relative;z-index:1;width:100%;max-width:450px;background:var(--card);border:1px solid var(--ln);border-radius:28px;padding:clamp(22px,4vw,34px);box-shadow:0 30px 70px -24px rgba(0,60,70,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.box h1{font-size:1.7rem;font-weight:850;letter-spacing:-.025em;margin:16px 0 2px}
.box .cr{display:flex;justify-content:center;margin-top:18px}
.tabs{display:flex;background:var(--fld);border:1px solid var(--ln);border-radius:15px;padding:4px;margin:18px 0}
.tabs a{flex:1;text-align:center;padding:10px;border-radius:11px;cursor:pointer;font-weight:750;color:var(--mut);transition:all .3s}.tabs a:hover{color:var(--ink)}
.tabs a.on{background:linear-gradient(135deg,#2dd4bf,#0d9488);color:#fff;box-shadow:0 8px 16px -8px rgba(13,148,136,.8);animation:pop .35s both}

function appsV(){const mine=S.apps.filter(a=>a.uid===me.id).sort((a,b)=>b.ts-a.ts),acc=S.apps.filter(a=>a.status==='accepted').sort((a,b)=>b.ts-a.ts),open=S.apps.filter(a=>a.status==='new'||a.status==='review').length;
 const T=[['new',tr('Yangi ariza')],['track',tr('Status kuzatuvi')+' ('+mine.length+')'],['board',tr('Qabul qilingan takliflar')+' ('+acc.length+')']].concat(isAdm(me)?[['adm',tr('Ma’muriyat')+' ('+open+')']]:[]);
 let b='';
 if(AT==='new')b=`<div class="card"><h3>Yangi murojaat yoki taklif</h3><p class="mut">Ma’lumotni aniq va batafsil to‘ldiring. Dars jadvali yoki o‘quvchi bo‘yicha aniq dalillar keltirish tavsiya etiladi.</p>
  <div class="anon ${AD.anon?'on':''}"><i>${MI.shield}</i><div style="flex:1"><b>Anonim (maxfiy) murojaat rejimi</b><div class="mut">Shaxsingizni yashirishni xohlasangiz, ushbu rejimni yoqing.</div></div></div>
  <button class="btn line" style="width:100%" onclick="AD.anon=!AD.anon;draw()">${AD.anon?MI.check+' Maxfiy rejim yoqilgan':tr('Maxfiy rejimni yoqish')}</button>
  ${AD.anon?'':`<label>F.I.SH</label><input value="${esc(me.name)}" disabled>`}
  <label>Yo‘nalish</label><select onchange="AD.cat=this.value">${ACAT.map(c=>`<option ${c===AD.cat?'selected':''}>${c}</option>`).join('')}</select>
  <label>Murojaat matni</label><textarea id="ap_t" rows="5" oninput="AD.txt=this.value" placeholder="Muammo yoki taklifingizni yozing…">${esc(AD.txt)}</textarea>
  <button class="btn line sm" onclick="dictate()">${MI.mic}Ovozli yozish</button>
  <label style="display:block;margin-top:12px">Muhimlik darajasi</label><div class="lvs">${LV.map(l=>`<a class="${AD.lvl===l?'on':''}" onclick="AD.lvl='${l}';draw()">${l}</a>`).join('')}</div>
  <button class="btn ai" onclick="aiDraft()">${MI.spark} AI bilan tahlil qilish</button>${AIH?aiBox(AIH):''}
  <button class="btn g" style="width:100%;margin-top:12px" onclick="sendApp()">${I.tg}${tr('Arizani yuborish')}</button></div>`;
 else if(AT==='track')b=mine.map(a=>`<div class="card" style="margin-bottom:12px"><div class="cb" style="margin:0 0 8px">${stB(a.status)}<span class="chip">${esc(a.cat)}</span><span class="chip">${esc(a.level)}</span>${a.anon?'<span class="chip">Anonim</span>':''}<span class="mut">${fdate(a.ts)}</span></div><p>${esc(a.text)}</p>${a.reply?`<div class="aibox" style="background:var(--fld);border-color:var(--ln)"><b>Ma’muriyat javobi</b><br>${esc(a.reply)}</div>`:''}</div>`).join('')||'<div class="empty">Siz hali ariza yubormagansiz.</div>';
 else if(AT==='board')b=acc.map(a=>`<div class="card" style="margin-bottom:12px"><div class="cb" style="margin:0 0 8px">${stB('accepted')}<span class="chip">${esc(a.cat)}</span><span class="mut">${esc(a.by||'Anonim')} · ${fdate(a.ts)}</span></div><p>${esc(a.text)}</p>${a.reply?`<p class="mut" style="margin-top:6px">↳ ${esc(a.reply)}</p>`:''}</div>`).join('')||'<div class="empty">Qabul qilingan takliflar hali yo‘q.</div>';
 else if(AT==='adm'&&isAdm(me)){const ord={new:0,review:1,accepted:2,rejected:3};b=[...S.apps].sort((a,b)=>ord[a.status||'new']-ord[b.status||'new']||b.ts-a.ts).map(a=>`<div class="card" style="margin-bottom:12px"><div class="cb" style="margin:0 0 8px">${stB(a.status)}<span class="chip">${esc(a.cat)}</span><span class="chip">${esc(a.level)}</span><span class="mut">${esc(a.anon?'Anonim':a.by||'')} · ${fdate(a.ts)}</span></div><p>${esc(a.text)}</p>
  <select id="as_${a.id}">${Object.keys(ST).map(k=>`<option value="${k}" ${(a.status||'new')===k?'selected':''}>${ST[k][0]}</option>`).join('')}</select><textarea id="ar_${a.id}" rows="2" placeholder="Ma’muriyat javobi…">${esc(a.reply||'')}</textarea>
  <div class="row" style="align-items:center"><button class="btn sm" style="flex:0" onclick="saveApp('${a.id}')">${tr('Saqlash')}</button><button class="btn ai sm" style="flex:0;white-space:nowrap" onclick="aiApp('${a.id}')">${MI.spark} AI bilan tahlil</button></div>${AIA[a.id]?aiBox(AIA[a.id]):''}</div>`).join('')||'<div class="empty">Arizalar yo‘q.</div>'}
 return `<h2>${tr('Arizalar')}</h2><div class="tabs2">${T.map(([k,l])=>`<a class="${AT===k?'on':''}" onclick="AT='${k}';draw()">${l}</a>`).join('')}</div>${b}`}
function dictate(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('Brauzeringiz ovozli yozishni qo‘llamaydi (Chrome tavsiya etiladi).');return}
 const r=new R();r.lang='uz-UZ';r.interimResults=false;r.onresult=e=>{AD.txt=(AD.txt+' '+e.results[0][0].transcript).trim();draw()};r.onerror=()=>alert('Mikrofon ishlamadi. Ruxsat bering.');r.start()}
async function aiDraft(){if(AD.txt.trim().length<10)return alert('Avval ariza matnini yozing');AIH='Tahlil qilinmoqda…';draw();const o=await ai('improve',`Yo‘nalish: ${AD.cat}. Muhimlik: ${AD.lvl}.\n${AD.txt}`);AIH=o.error||o.text;draw()}
function sendApp(){const t=AD.txt.trim();if(t.length<10){alert('Ariza matni juda qisqa');return}
 put('apps','a'+Date.now(),{cat:AD.cat,text:t.slice(0,2000),level:AD.lvl,anon:AD.anon,status:'new',reply:'',ts:Date.now(),by:AD.anon?'Anonim':me.name,uid:me.id});AD={...AD,txt:''};AIH='';AT='track';draw()}
function saveApp(id){const a=S.apps.find(x=>x.id===id);if(a)put('apps',id,{...a,status:$('#as_'+id).value,reply:$('#ar_'+id).value.trim().slice(0,1500)})}
async function aiApp(id){const a=S.apps.find(x=>x.id===id);if(!a)return;AIA[id]='Tahlil qilinmoqda…';draw();const o=await ai('analyze',`Yo‘nalish: ${a.cat}. O‘quvchi tanlagan muhimlik: ${a.level}.\n${a.text}`);AIA[id]=o.error||o.text;draw()}

function countUp(){document.querySelectorAll('[data-count]').forEach(el=>{const t=+el.dataset.count;if(!t)return;const s=performance.now();(function f(n){const p=Math.min(1,(n-s)/1000);el.textContent=Math.round(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)})}
function revealInit(){if(RM()||!window.IntersectionObserver)return;const vh=innerHeight,els=[...document.querySelectorAll('#app .wrap .card,#app .wrap .ach-card,#app .wrap .nw,#app .wrap .tc,#app .wrap .dst>div')].filter(e=>e.getBoundingClientRect().top>vh*.92);if(!els.length)return;
 const fin=e=>setTimeout(()=>{e.classList.remove('rv','in');e.style.removeProperty('--rd')},900),io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');fin(x.target);io.unobserve(x.target)}}),{threshold:.06});
 els.forEach((e,i)=>{e.classList.add('rv');e.style.setProperty('--rd',(i%4)*60+'ms');io.observe(e)});setTimeout(()=>els.forEach(e=>{if(e.classList.contains('rv')){e.classList.add('in');fin(e)}}),5000)}
function draw(){if(!ready)return;const a=$('#app'),f=document.activeElement?.id,k=(me?view:'auth')+mode,fresh=k!==window._k;
 if(!me){const h=authUI(),sg=h;if(!fresh&&sg===window._h)return;a.className=fresh?'anim':'';window._k=k;window._h=sg;a.innerHTML=h;mountTg();return}
 const v={home,day:dayV,clubs:clubsV,initiative:initiativeV,subjectOlymp:subjectOlympV,fam:famV,news:newsV,sched:schedV,classes:classV,msgs:msgV,me:meV,panel:panelV,hw:hwV,ask:askV,snap:snapV,tutor:tutorV,plan:planV,quiz:quizV,apps:appsV,par:parV}[view]||home;
 if(view==='panel'&&!isAdm(me))view='home';
 if((['n_t','n_b','p_n','m_t','m_b','s_f','s_t','s_r','t_name','t_subj','t_un','t_pw','sb_n','ap_t','h_t','an_t','an_b','qz_t'].includes(f)||/^(c_|ci_|ph_|ar_)/.test(f||''))&&document.activeElement.value)return;
 const h=shell(v()),sg=(document.documentElement.dataset.theme||'')+'|'+h;
 if(!fresh&&sg===window._h){updateNow();return}
 a.className=fresh?'anim':'';window._k=k;window._h=sg;a.innerHTML=h;updateNow();if(fresh&&!RM()){countUp();revealInit()}}
(async()=>{
 try{if(window.claude)db=await Promise.race([claude.use('db'),new Promise(r=>setTimeout(()=>r(null),4000))])}catch(e){db=null}
 COLS.forEach(load);connectRT();syncMe();ready=true;draw()})();

addEventListener('offline',chk);addEventListener('online',()=>{chk();if(API()){COLS.forEach(reload);connectRT()}});chk();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('.btn');if(!b||RM())return;const r=b.getBoundingClientRect(),z=Math.max(r.width,r.height)*2.2,i=document.createElement('i');i.className='rip';i.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.appendChild(i);setTimeout(()=>i.remove(),700)});
